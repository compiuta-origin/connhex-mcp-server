[project]
name = "connhex-cli"
version = "0.1.0"
description = "Connhex command-line interface"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "connhex-sdk",
    "typer>=0.25.1",
    "rich>=13.0",
    "pydantic-settings>=2.0",
]

[project.scripts]
connhex-cli = "connhex_cli.main:app"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
connhex-sdk = { workspace = true }
