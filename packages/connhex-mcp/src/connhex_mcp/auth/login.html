<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sign in to Connhex</title>
        <link rel="icon" href="/favicon.ico" />
        <style>
            :root {{
                --connhex-light: #f0f1f2;
                --connhex-dark: #0d1b2a;
                --connhex-darker: #081420;
                --connhex-orange: #f07d25;
                --connhex-cyan: #03d8ff;
                --connhex-purple: #c084fc;
            }}
            * {{ margin: 0; padding: 0; box-sizing: border-box; }}
            body {{
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI',
                             Roboto, sans-serif;
                background:
                    radial-gradient(circle at top, rgba(3,216,255,0.12), transparent 34rem),
                    linear-gradient(145deg, var(--connhex-darker) 0%, var(--connhex-dark) 100%);
                color: var(--connhex-light);
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 1rem;
            }}
            .card {{
                background: rgba(13,27,42,0.94);
                border: 1px solid rgba(240,241,242,0.14);
                border-radius: 12px;
                padding: 2.25rem;
                width: 100%;
                max-width: 400px;
                box-shadow:
                    0 30px 60px -20px rgba(0,0,0,0.72),
                    inset 0 1px 0 rgba(255,255,255,0.03);
            }}
            .logo {{
                text-align: center;
                margin-bottom: 1.625rem;
            }}
            .logo img {{
                display: block;
                width: 56px;
                height: 56px;
                margin: 0 auto 1rem;
                border-radius: 10px;
            }}
            .logo h1 {{
                font-size: 1.25rem;
                font-weight: 600;
                color: var(--connhex-light);
            }}
            .logo p {{
                font-size: 0.875rem;
                color: rgba(240,241,242,0.68);
                margin-top: 0.25rem;
            }}
            .error {{
                background: #450a0a;
                border: 1px solid #7f1d1d;
                color: #fca5a5;
                padding: 0.75rem 1rem;
                border-radius: 8px;
                font-size: 0.875rem;
                margin-bottom: 1rem;
                display: flex;
                align-items: center;
                gap: 0.5rem;
            }}
            label {{
                display: block;
                font-size: 0.875rem;
                font-weight: 500;
                color: rgba(240,241,242,0.78);
                margin-bottom: 0.375rem;
            }}
            input[type="email"], input[type="password"] {{
                width: 100%;
                padding: 0.625rem 0.75rem;
                background: var(--connhex-darker);
                border: 1px solid rgba(240,241,242,0.18);
                border-radius: 8px;
                color: var(--connhex-light);
                font-size: 0.9375rem;
                outline: none;
                transition: border-color 0.15s;
            }}
            input:focus {{
                border-color: var(--connhex-cyan);
                box-shadow: 0 0 0 3px rgba(3,216,255,0.16);
            }}
            .field {{ margin-bottom: 1rem; }}
            button {{
                width: 100%;
                padding: 0.625rem 1rem;
                background: var(--connhex-orange);
                color: #fff;
                border: none;
                border-radius: 8px;
                font-size: 0.9375rem;
                font-weight: 500;
                cursor: pointer;
                transition: background 0.15s;
                margin-top: 0.5rem;
            }}
            button:hover {{ background: #e96e10; }}
            button:active {{ background: #dc680f; }}
            .links {{
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 0.75rem;
                margin-top: 1.125rem;
                font-size: 0.8125rem;
            }}
            .links a {{
                color: var(--connhex-cyan);
                text-decoration: none;
            }}
            .links a:hover {{
                color: var(--connhex-orange);
                text-decoration: underline;
            }}
            .footer {{
                text-align: center;
                margin-top: 1.25rem;
                font-size: 0.75rem;
                color: rgba(240,241,242,0.48);
            }}
        </style>
    </head>
    <body>
        <div class="card">
            <div class="logo">
                <img src="/connhex-logo.webp" alt="Connhex" />
                <h1>Sign in to Connhex</h1>
                <p>Authorize MCP access to your account</p>
            </div>
            <form method="POST" action="/oauth/login">
                <input
                    type="hidden"
                    name="flow_id"
                    value="{_html.escape(flow_id)}"
                />
                <div class="field">
                    <label for="identifier">Email</label>
                    <input
                        type="email"
                        id="identifier"
                        name="identifier"
                        required
                        autocomplete="email"
                        autofocus
                    />
                </div>
                <div class="field">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                    />
                </div>
                <button type="submit">Sign in</button>
            </form>
            <div class="links">
                <a
                    href="https://connhex.com"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Learn about Connhex
                </a>
                <a
                    href="https://accounts.connhex.com/registration"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Create a free account
                </a>
            </div>
            <div class="footer">
                Your credentials are sent directly to Connhex and are not
                stored.
            </div>
        </div>
    </body>
</html>
