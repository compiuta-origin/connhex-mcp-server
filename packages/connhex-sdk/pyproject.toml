[project]
name = "connhex-sdk"
version = "0.1.0"
description = "The official Python library for the Connhex API"
readme = "README.md"
license = "MIT"
authors = [ { name = "Compiuta", email = "connhex@compiuta.com" } ]

requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
