[project]
name = "connhex-mcp"
version = "0.1.0"
description = "Connhex MCP Server"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "connhex",
    "cryptography>=42.0",
    "fastmcp>=3.2.0",
    "pydantic-settings>=2.0.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
]

[project.scripts]
connhex-mcp = "connhex_mcp.main:main"

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
connhex = { workspace = true }
