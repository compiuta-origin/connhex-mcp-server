[project]
name = "connhex-tools"
# Workspace aggregator — not a real artifact, version is non-semantic.
version = "0.0.0"
description = "Connhex tools workspace: SDK, MCP server, and CLI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "connhex",
    "connhex-mcp",
    "connhex-cli",
]

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
connhex = { workspace = true }
connhex-mcp = { workspace = true }
connhex-cli = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "pre-commit>=4.0",
    "unasync>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 80

[tool.pytest.ini_options]
testpaths = [
    "packages/connhex-sdk/tests",
    "packages/connhex-mcp/tests",
    "packages/connhex-cli/tests",
]
