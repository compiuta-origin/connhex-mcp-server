repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: generate-sync
        name: regenerate connhex-sdk sync/ from aio/
        entry: uv run python packages/connhex-sdk/scripts/generate_sync.py
        language: system
        files: ^packages/connhex-sdk/src/connhex/aio/
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run python -m pytest
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
